server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # rotas são client-side (HashRouter) — qualquer caminho cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # arquivos com hash no nome (gerados pelo Vite) podem ser cacheados para sempre
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
