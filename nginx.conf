server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # rotas são client-side (HashRouter) — qualquer caminho cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # só o que o Vite gera em /assets/ tem hash no nome — cache pode ser eterno
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # arquivos estáticos servidos direto de public/ (favicon.svg, icons.svg) não têm
    # hash no nome, então "immutable" quebraria a atualização em um deploy futuro
    location ~* \.(?:svg|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
